<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlackBox recordings</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="theme.js"></script>
</head>
<body class="page-recordings">
  <header>
    <h1>BlackBox recordings</h1>
    <div class="meta"></div>
    <div class="actions">
      <button id="settings">Settings</button>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <section id="library" class="library">
    <div class="library-bar">
      <button id="linkFolder" title="Pick Downloads/blackbox to list recordings saved on disk">Link folder…</button>
      <button id="allowFolder" hidden>Allow access</button>
      <button id="unlinkFolder" hidden>Unlink folder</button>
      <label class="button" title="Add a recording ZIP (Download ZIP on a BlackBox server) to the extension">Import ZIP…
        <input type="file" id="importZip" accept=".zip,application/zip" hidden></label>
      <span id="folderInfo" class="muted"></span>
      <span class="batch">
        <span id="selCount" class="muted">Tick recordings to act on several at once</span>
        <button id="batchUpload" disabled>Upload selected</button>
        <button id="batchZip" disabled title="One ZIP per recording, to import on a BlackBox server or in another browser">Download ZIP</button>
        <button id="batchDelete" disabled>Delete selected</button>
      </span>
    </div>
    <table>
      <thead><tr>
        <th class="sel"><input type="checkbox" id="selAll" title="Select all shown"></th>
        <th>Recorded</th><th>Page</th><th>Length</th>
        <th title="Console errors, failed requests and slow requests (the server's slow threshold, or 2 s)">Browser issues</th>
        <th>Status</th>
      </tr></thead>
      <tbody id="libraryRows"></tbody>
    </table>
    <button id="showMore" class="show-more" hidden>Show more</button>
    <p id="libraryMsg" class="muted" hidden></p>
    <p id="libraryEmpty" class="muted" hidden>No recordings yet. Record one with the extension icon, or link the folder with your exported recordings.</p>
  </section>

  <section id="uploadBox" class="upload-box" hidden>
    <strong id="upHeading">Upload</strong>
    <label for="upTitle">Title</label>
    <input id="upTitle" type="text" maxlength="200">
    <label for="upNotes">Notes <span class="muted">(steps, what went wrong)</span></label>
    <textarea id="upNotes" maxlength="5000" rows="3"></textarea>
    <p id="upAtStop" class="muted" hidden></p>
    <label id="upAppsRow" class="check" hidden title="The server exports the apps the recording used (.jwa), so support can import them">
      <input type="checkbox" id="upApps" checked> Export the apps used</label>
    <label id="upSampleRow" class="check" hidden title="Added to the exported apps (.jwa) on the server: the records you opened or saved, with fake values of the same shape">
      <input type="checkbox" id="upSample" checked> Include sample form data</label>
    <label id="upMaskRow" class="check" hidden title="Fake values of the same shape. Unticked: real values, except columns the server marks as sensitive.">
      <input type="checkbox" id="upMask" checked> Mask data <span class="muted">(unticked: real customer data, share the recording only with people who may see it)</span></label>
    <div class="upload-actions">
      <button id="upSend" class="primary">Send</button>
      <button id="upCancel">Cancel</button>
      <span id="upStatus"></span>
    </div>
    <progress id="upProgress" max="1" value="0" hidden></progress>
  </section>

  <script src="idb.js"></script>
  <script src="zip.js"></script>
  <script src="report.js"></script>
  <script src="server.js"></script>
  <script src="store.js"></script>
  <script src="quick.js"></script>
  <script src="actions.js"></script>
  <script src="recordings.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <script src="theme.js"></script>
  <style>
    /* Chrome caps popups at 600px tall (800px wide): wider, so everything fits without scrolling */
    body { width: 340px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; }
    /* Title as a dark green band across the top */
    h1 { font-size: 15px; margin: -12px -12px 12px; padding: 10px 12px; background: var(--brand); color: #fff; }
    h1::before { background: radial-gradient(circle, #ff6b5e 0 3.5px, rgba(255, 255, 255, .18) 4px); }
    button { width: 100%; padding: 10px; border: 0; border-radius: 10px; color: var(--on-accent); font: 600 13px system-ui, sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    /* Record buttons in one row: screen, window, tab; the hint shows under the label; "Record the screen" is the
       main action */
    .start { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .start button { display: flex; flex-direction: column; justify-content: flex-start; gap: 3px; text-align: left; padding: 8px 9px; line-height: 1.25; background: var(--bg); color: var(--fg); border: 1px solid var(--field-line); }
    .start button:hover:not(:disabled) { border-color: var(--accent); }
    .start button:first-child { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .start button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
    .start button:first-child small { color: inherit; opacity: .85; }
    #stop { background: var(--danger); }
    #status { margin-top: 8px; color: var(--muted); min-height: 1em; }
    #serverNote, #incognitoNote { margin-top: 8px; color: var(--warn); overflow-wrap: anywhere; }
    #error { margin-top: 8px; color: var(--danger); white-space: pre-wrap; }
    #viewer, #settings { display: inline-block; margin: 10px 16px 0 0; font-weight: 600; text-decoration: none; }
    #viewer:hover, #settings:hover { text-decoration: underline; }
    #quick { margin: 10px 0 0; padding: 6px 10px 10px; border: 1px solid var(--line); border-radius: 10px; }
    #quick legend { padding: 0 4px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    #quick label { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
    #quick > label { display: inline-flex; margin-right: 16px; } /* Page sound and Microphone on one row */
    #quick label input { margin: 0; }
    #quick .sub { margin-left: 18px; }
    #quick .sub2 { margin-left: 36px; }
    #qRealWarn { margin: 2px 0 0 36px; color: var(--warn); }
    #qNote { margin-top: 4px; color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>BlackBox</h1>
  <div id="start" class="start">
    <button data-mode="screen" title="Pick a screen">Record the screen<small>Pick a screen</small></button>
    <button data-mode="window" title="Pick a window; pick a Chrome window to get the URL bar">Record a window<small>Pick a Chrome window to get the URL bar</small></button>
    <button data-mode="tab" title="Records this tab's page directly, no picker (no URL bar in the video)">Record this tab<small>No picker, no URL bar in the video</small></button>
  </div>
  <!-- Quick settings for the next recording: sound is this browser's; the rest the server offers (BlackBox plugin
       settings and this user's rights, me.options). Every box starts unticked and asks for its part. -->
  <fieldset id="quick">
    <legend>Quick Settings</legend>
    <label title="The sound of the tab you start from, also when you record a window or the screen"><input type="checkbox" id="qPage"> Page sound</label>
    <label title="To talk through the problem while recording"><input type="checkbox" id="qMic"> Microphone</label>
    <div id="qServer" hidden>
      <label id="qAppsRow" hidden title="When the recording stops, the server exports the apps it used (.jwa), so support can import them"><input type="checkbox" id="qApps"> Export the apps used</label>
      <label id="qSampleRow" class="sub" hidden title="Rows added to the exported apps (.jwa): the records you opened or saved, rows linked to them, and the processes you touched. Real values unless Mask data is ticked"><input type="checkbox" id="qSample"> Capture apps data</label>
      <label id="qMaskRow" class="sub2" hidden title="Masks all apps data: values, record ids (primary keys), process data and user names; uploaded files become placeholders"><input type="checkbox" id="qMask"> Mask data</label>
      <div id="qRealWarn" hidden>Real customer data: share the recording only with people who may see it.</div>
      <label id="qAllServerRow" hidden title="Also every other log line the server writes while recording (scheduler jobs, other users' requests). Off by default: the lines hold other users' data"><input type="checkbox" id="qAllServer"> All server log lines</label>
      <label id="qGaugesRow" hidden title="CPU, heap, busy request threads, database connections and GC time of each server node, every second (the Server load strip)"><input type="checkbox" id="qGauges"> Capture server load</label>
      <label id="qTracesRow" hidden title="Glowroot's trace of each slow or failed recorded request, shown in the replay page's Traces tab"><input type="checkbox" id="qTraces"> Capture Glowroot trace files</label>
      <label id="qGlowrootRow" hidden title="The recording cut out of each node's Glowroot data (traces, aggregates, gauges), to download and open in a standalone Glowroot; built 30 to 90 seconds after it stops"><input type="checkbox" id="qGlowroot"> Capture Glowroot data</label>
    </div>
    <div id="qNote" hidden></div>
  </fieldset>
  <button id="stop" hidden>Stop &amp; save</button>
  <div id="status"></div>
  <div id="serverNote" hidden></div>
  <div id="incognitoNote" hidden></div>
  <a href="#" id="viewer">Recordings</a>
  <a href="#" id="settings">Settings</a>
  <div id="error"></div>
  <script src="server.js"></script>
  <script src="quick.js"></script>
  <script src="popup.js"></script>
</body>
</html>

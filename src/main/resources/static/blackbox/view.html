<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlackBox Replay</title>
  <link rel="stylesheet" href="assets/viewer.css">
</head>
<body>
  <!-- Same frame as the extension's replay page (viewer.html): header, then the status bar -->
  <header class="replay-head">
    <div class="header-left">
      <h1><a id="back" href="./">← Recordings</a> <span id="recTitle">BlackBox replay</span></h1>
      <nav id="recNav" class="rec-nav" hidden>
        <a id="olderRec" class="button" href="#">◀ Older</a>
        <span id="recPos"></span>
        <a id="newerRec" class="button" href="#">Newer ▶</a>
      </nav>
    </div>
    <div class="header-right">
      <div id="recStatus" class="rec-status" hidden>
        <span id="where" class="where"></span>
        <a id="dlZip" class="button" href="#" title="The recording as one ZIP, to import it into another Joget or open it in the BlackBox viewer">Download ZIP</a>
        <a id="dlHtml" class="button" href="#" title="One file that replays this recording in any browser, without BlackBox">Download HTML</a>
        <span id="dlGlowroot" hidden></span><!-- view.js: one button per node's Glowroot data -->
        <button id="delete" hidden>Delete</button>
      </div>
      <div class="actions">
        <button id="featuresBtn" title="What this replay page can do">? Features</button>
        <select id="textSize" title="Text size (remembered in this browser)">
          <option value="0.9">Aa 90%</option>
          <option value="1" selected>Aa 100%</option>
          <option value="1.15">Aa 115%</option>
          <option value="1.3">Aa 130%</option>
        </select>
      </div>
      <input type="file" id="files" hidden><!-- viewer.js expects it; recordings come from the server here -->
    </div>
  </header>
  <!-- Features drawer (viewer.js): opened by the Features button in the header -->
  <aside id="featuresDrawer" class="drawer" role="dialog" aria-labelledby="featuresTitle" hidden>
    <div class="drawer-head">
      <strong id="featuresTitle">Features</strong>
      <button id="featuresClose" title="Close (Esc)">✕</button>
    </div>
    <div id="features" class="drawer-body features"></div>
  </aside>
  <p id="notes" class="notes" hidden></p>

  <div id="error" class="error" hidden></div>

  <main id="empty" class="empty">
    <p id="loading">Loading…</p>
  </main>

  <main id="app" hidden>
    <section class="player">
      <video id="video" controls playsinline></video>
      <div id="noVideo" class="no-video" hidden>
        <div>
          <p>This recording has no video.</p>
          <input type="file" id="videoFile" hidden>
        </div>
      </div>
      <div class="clock-row">
        <span id="clock">0:00.0 / 0:00.0</span>
        <span class="jump">
          <button id="prevIssue" title="Go to the previous error, failed request or server error">◀ Prev issue</button>
          <button id="nextIssue" title="Go to the next error, failed request or server error">Next issue ▶</button>
        </span>
      </div>
      <div class="legend">
        <span>Issues</span>
        <span><i class="dot error"></i>Console error</span>
        <span><i class="dot failed"></i>Failed request</span>
        <span><i class="dot nav"></i>Navigation</span>
        <span id="serverLegend" hidden><i class="dot server"></i>Server error</span>
      </div>
      <div id="timeline" class="timeline" title="Click to seek">
        <div id="markers"></div>
        <div id="playhead" class="playhead"></div>
      </div>
    </section>

    <section class="panel">
      <nav class="tabs">
        <button data-tab="console" class="active">Console <span id="consoleCount" class="count"></span></button>
        <button data-tab="network">Network <span id="networkCount" class="count"></span></button>
        <button data-tab="server" id="serverTab" hidden>System logs <span id="serverCount" class="count"></span></button>
        <button data-tab="traces" id="tracesTab" hidden>Traces <span id="tracesCount" class="count"></span></button>
        <button data-tab="info">Info</button>
      </nav>
      <div id="toolbar" class="toolbar">
        <input id="search" type="search" placeholder="Filter">
        <select id="filter"></select>
        <label><input type="checkbox" id="follow" checked> Follow</label>
        <label><input type="checkbox" id="hideFuture"> Hide future</label>
      </div>
      <div id="list" class="list"></div>
      <div id="info" class="info" hidden></div>
      <div id="detail" class="detail" hidden>
        <div class="detail-head">
          <strong id="detailTitle"></strong>
          <span class="detail-actions" id="detailActions"></span>
          <button id="detailClose" title="Close">✕</button>
        </div>
        <div id="detailBody" class="detail-body"></div>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/viewer.js"></script>
  <script src="assets/view.js"></script>
</body>
</html>
